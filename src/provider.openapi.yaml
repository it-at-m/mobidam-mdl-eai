        id: y6kgbr644ng4u
      properties:
        links:
          description: 'If pagination is used for endpoints that support it, the pagination must comply with the [JSON API](http://jsonapi.org/format/#fetching-pagination) specification.'
          type: object
          required:
            - next
          additionalProperties: false
          properties:
            first:
              type:
                - 'null'
                - string
              title: The URL to the first page of data.
              examples:
                - 'https://data.provider.co/trips/first'
              format: uri
            last:
              type:
                - 'null'
                - string
              title: The URL to the last page of data.
              examples:
                - 'https://data.provider.co/trips/last'
              format: uri
            prev:
              type:
                - 'null'
                - string
              title: The URL to the previous page of data.
              examples:
                - 'https://data.provider.co/trips/prev'
              format: uri
            next:
              type:
                - 'null'
                - string
              title: The URL to the next page of data.
              examples:
                - 'https://data.provider.co/trips/next'
              format: uri
    Ttl:
      title: response/ttl
      type: object
      x-stoplight:
        id: kejk1tkl7fdd2
      required:
        - ttl
      properties:
        ttl:
          $ref: '#/components/schemas/Integer-positive'
          description: |-
            Integer representing the number of milliseconds before the data in this feed will be updated again
            (0 if the data should always be refreshed). The data returned by a near-realtime endpoint should be as close to realtime
            as possible, but in no case should it be more than 5 minutes out-of-date.
          maximum: 300000
    Version:
      title: response/version
      description: Response bodies must be a UTF-8 encoded JSON object and must minimally include the MDS `version`.
      type: object
      x-stoplight:
        id: ivd8jadc3rqf7
      required:
        - version
      properties:
        version:
          $ref: '#/components/schemas/Version_2'
    Stop:
      title: models/stop
      description: |-
        Stops describe vehicle trip start and end locations in a pre-designated physical place. They can vary from docking stations
        with or without charging, corrals with lock-to railings, or suggested parking areas marked with spray paint.
        Stops are used in both [Provider](../reference/provider.yaml) and [Agency](#) telemetry data.
      type: object
      x-stoplight:
        id: m0f816guajcjj
      allOf:
        - required:
            - name
            - location
            - status
            - capacity
            - num_vehicles_available
            - num_vehicles_disabled
          properties:
            name:
              $ref: '#/components/schemas/String'
              description: Name of the stop.
            location:
              $ref: '#/components/schemas/Gps'
              description: Simple centerpoint location of the Stop. The use of the optional `geography_id` is recommended to provide more detail.
            capacity:
              $ref: '#/components/schemas/Vehicle-type-counts'
              description: 'Number of total places per [`vehicle_type`](./data-types/vehicle-type.yaml).'
            provider_id:
              $ref: '#/components/schemas/Uuid'
              description: |-
                UUID for the Provider managing this Stop. Null/undefined if managed by an Agency.
                See MDS [provider list](https://github.com/openmobilityfoundation/mobility-data-specification/blob/main/providers.csv).
            data_provider_id:
              $ref: '#/components/schemas/Uuid'
              description: |-
                UUID for the data provider managing the data coming from this stop.
                Null/undefined if managed by an agency or a provider. Null/undefined if managed by an Agency.
                See MDS [provider list](https://github.com/openmobilityfoundation/mobility-data-specification/blob/main/providers.csv).
            geography_id:
              $ref: '#/components/schemas/Uuid'
              description: 'Pointer to the [Geography](#) that represents the Stop geospatially via Polygon or MultiPolygon.'
            region_id:
              $ref: '#/components/schemas/String'
              description: 'ID of the region where station is located. See [GBFS Station Information](https://github.com/NABSA/gbfs/blob/master/gbfs.md#station_informationjson).'
            short_name:
              $ref: '#/components/schemas/String'
              description: Abbreviated stop name.
            address:
              $ref: '#/components/schemas/String'
              description: Postal address (useful for directions).
            post_code:
              $ref: '#/components/schemas/String'
              description: Postal code.
              examples:
                - 10036
            cross_street:
              $ref: '#/components/schemas/String'
              description: Cross street of where station is located.
            parent_stop:
              $ref: '#/components/schemas/Uuid'
              description: Describe a basic hierarchy of stops (e.g. a stop inside a greater stop).
            image_url:
              type: string
              format: uri
              description: 'Link to an image, photo, or diagram of the stop. Could be used by providers to help riders find or use the stop.'
        - $ref: '#/components/schemas/Mutable-stop'
    Telemetry:
      title: models/telemetry
      description: |-
        A standard point of vehicle telemetry. References to latitude and longitude imply coordinates encoded in the
        [WGS 84 (EPSG:4326)](https://en.wikipedia.org/wiki/World_Geodetic_System) standard GPS or GNSS projection expressed
        as [Decimal Degrees](https://en.wikipedia.org/wiki/Decimal_degrees).
      type: object
      x-stoplight:
        id: 47oju05zyh09f
      required:
        - device_id
        - provider_id
        - telemetry_id
        - timestamp
        - trip_ids
        - journey_id
        - location
      properties:
        device_id:
          $ref: '#/components/schemas/Uuid'
          description: A unique device ID in UUID format.
        provider_id:
          $ref: '#/components/schemas/Uuid'
          description: 'A UUID for the Provider, unique within MDS. See MDS [provider list](https://github.com/openmobilityfoundation/mobility-data-specification/blob/main/providers.csv).'
        data_provider_id:
          $ref: '#/components/schemas/Uuid'
          description: 'If different than `provider_id`, a UUID for the data solution provider managing the data feed in this endpoint.'
        telemetry_id:
          $ref: '#/components/schemas/Uuid'
          description: ID used for uniquely-identifying a Telemetry entry.
        timestamp:
          $ref: '#/components/schemas/Timestamp'
          description: Date/time that event occurred.
        trip_ids:
          oneOf:
            - $ref: '#/components/schemas/Uuid-array'
              minItems: 1
              description: 'If telemetry occurred during a trip, the ID of the trip(s).'
            - type: 'null'
              description: 'If not in a trip, null.'
        journey_id:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
              description: 'If telemetry occurred during a trip and journeys are used for the mode, the ID of the journey.'
            - type: 'null'
              description: 'If not in a trip, null.'
        stop_id:
          $ref: '#/components/schemas/Uuid'
          description: Stop that the vehicle is currently located at.
        location:
          $ref: '#/components/schemas/Gps'
          description: Telemetry position data.
        location_type:
          type: string
          enum:
            - street
            - sidewalk
            - crosswalk
            - garage
            - bike_lane
        battery_percent:
          $ref: '#/components/schemas/Integer-positive'
          description: 'Percent battery charge of vehicle, expressed between 0 and 100.'
          maximum: 100
        fuel_percent:
          $ref: '#/components/schemas/Integer-positive'
          description: 'Percent fuel in vehicle, expressed between 0 and 100.'
          maximum: 100
        tipped_over:
          type: boolean
          description: 'If detectable and known, is the device tipped over or not?'
          default: false
    Trip:
      title: models/trip
      description: A trip represents a journey taken by a _mobility as a service_ customer with a geo-tagged start and stop point.
      type: object
      x-stoplight:
        id: 6s0dm1r2gk9x0
      required:
        - provider_id
        - device_id
        - trip_id
        - start_time
        - end_time
        - start_location
        - end_location
        - duration
        - distance
      allOf:
        - properties:
            provider_id:
              $ref: '#/components/schemas/Uuid'
              description: 'A UUID for the Provider, unique within MDS. See MDS [provider list](https://github.com/openmobilityfoundation/mobility-data-specification/blob/main/providers.csv).'
            data_provider_id:
              $ref: '#/components/schemas/Uuid'
              description: 'If different than `provider_id`, a UUID for the data solution provider managing the data feed in this endpoint.'
            device_id:
              $ref: '#/components/schemas/Uuid'
              description: A unique device ID in UUID format.
            trip_id:
              $ref: '#/components/schemas/Uuid'
              description: A unique ID for each trip
            trip_type:
              type: array
              uniqueItems: true
              items:
                type: string
            trip_attributes:
              type: object
            fare_attributes:
              type: object
            start_time:
              $ref: '#/components/schemas/Timestamp'
              description: Start of the passenger/driver trip.
            end_time:
              $ref: '#/components/schemas/Timestamp'
              description: End of the passenger/driver trip.
            start_location:
              $ref: '#/components/schemas/Gps'
              description: Location of the start of the trip.
            end_location:
              $ref: '#/components/schemas/Gps'
              description: Location of the end of the trip.
            duration:
              $ref: '#/components/schemas/Integer-positive'
              description: 'Trip duration, in seconds.'
              examples:
                - 600
            distance:
              $ref: '#/components/schemas/Integer-positive'
              description: 'Trip distance, in meters.'
              examples:
                - 1000
            publication_time:
              $ref: '#/components/schemas/Timestamp'
              description: Date/time that trip became available through the trips endpoint.
            accessibility_attributes:
              type:
                - array
                - object
            parking_verification_url:
              type:
                - string
                - 'null'
              format: uri
              description: 'A URL to a photo (or other evidence) of proper vehicle parking at the end of a trip, provided by customer or operator.'
              examples:
                - 'https://data.provider.co/parking_verify/1234.jpg'
            parking_category:
              type: string
              description: |-
                The type of parking location detected or provided and the end of a trip. Note that `other_valid` covers any other
                allowed parking location beyond what is enumerated, and `invalid` is any improper parking based on agency parking rules.
              enum:
                - corral
                - curb
                - rack
                - other_valid
                - invalid
            standard_cost:
              $ref: '#/components/schemas/Currency-cost'
              description: 'The cost, in the currency defined in `currency`, that it would cost to perform that trip in the standard operation of the System.'
              examples:
                - 500
            actual_cost:
              $ref: '#/components/schemas/Currency-cost'
              description: 'The actual cost, in the currency defined in `currency`, paid by the customer of the _mobility as a service_ provider.'
              examples:
                - 520
            currency:
              $ref: '#/components/schemas/Currency'
        - oneOf:
            - $ref: '#/components/schemas/Trip_2'
            - $ref: '#/components/schemas/Trip_3'
            - $ref: '#/components/schemas/Trip_4'
            - $ref: '#/components/schemas/Trip_5'
    Vehicle-status:
      title: models/vehicles-status
      description: 'A vehicle status record represents the current or last-known event and telemetry from a [vehicle](./vehicle.yaml).'
      type: object
      x-stoplight:
        id: cuu383rzjelef
      required:
        - device_id
        - provider_id
        - last_event
        - last_telemetry
      properties:
        device_id:
          $ref: '#/components/schemas/Uuid'
          description: A unique device ID in UUID format.
        provider_id:
          $ref: '#/components/schemas/Uuid'
          description: 'A UUID for the Provider, unique within MDS. See MDS [provider list](https://github.com/openmobilityfoundation/mobility-data-specification/blob/main/providers.csv).'
        data_provider_id:
          $ref: '#/components/schemas/Uuid'
          description: 'If different than `provider_id`, a UUID for the data solution provider managing the data feed in this endpoint.'
        last_event:
          $ref: '#/components/schemas/Event'
        last_telemetry:
          $ref: '#/components/schemas/Telemetry'
    Vehicle:
      title: models/vehicle
      description: Vehicle object in MDS.
      type: object
      x-stoplight:
        id: e7es4zmeat7ai
      required:
        - device_id
        - provider_id
        - vehicle_id
        - vehicle_type
        - propulsion_types
      allOf:
        - properties:
            device_id:
              $ref: '#/components/schemas/Uuid'
              description: A unique device ID in UUID format.
            provider_id:
              $ref: '#/components/schemas/Uuid'
              description: 'A UUID for the Provider, unique within MDS. See MDS [provider list](https://github.com/openmobilityfoundation/mobility-data-specification/blob/main/providers.csv).'
            data_provider_id:
              $ref: '#/components/schemas/Uuid'
              description: 'If different than `provider_id`, a UUID for the data solution provider managing the data feed in this endpoint.'
            vehicle_id:
              $ref: '#/components/schemas/String'
              description: 'A unique vehicle identifier (visible code, license plate, etc), visible on the vehicle itself.'
            vehicle_type:
              $ref: '#/components/schemas/Vehicle-type'
              description: The type of vehicle.
            vehicle_attributes:
              type: object
            propulsion_types:
              $ref: '#/components/schemas/Propulsion-type-array'
              description: The type of propulsion; allows multiple values.
              minItems: 1
            accessibility_attributes:
              type:
                - array
                - object
            battery_capacity:
              $ref: '#/components/schemas/Integer-positive'
              description: Capacity of battery expressed as milliamp hours (mAh).
            fuel_capacity:
              $ref: '#/components/schemas/Integer-positive'
              description: 'Capacity of fuel tank (liquid, solid, gaseous) expressed in liters.'
            maximum_speed:
              $ref: '#/components/schemas/Integer-positive'
              description: 'Maximum speed (kph) possible with vehicle under normal, flat incline, smooth surface conditions. Applicable if the device has a built-in or intelligent speed limiter/governor.'
        - oneOf:
            - $ref: '#/components/schemas/Vehicle_2'
            - $ref: '#/components/schemas/Vehicle_3'
            - $ref: '#/components/schemas/Vehicle_4'
            - $ref: '#/components/schemas/Vehicle_5'
paths:
  /vehicles:
    get:
      operationId: get-vehicles
      description: 'Get a list of known vehicles, with properties that do not change often.'
      summary: /vehicles
      responses:
        '200':
          description: Vehicles found.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Version'
                  - $ref: '#/components/schemas/Paging'
                  - $ref: '#/components/schemas/Last_updated'
                  - $ref: '#/components/schemas/Ttl'
                  - type: object
                    description: Vehicles data payload
                    required:
                      - vehicles
                    properties:
                      vehicles:
                        type: array
                        items:
                          $ref: '#/components/schemas/Vehicle'
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: Vehicles not found.
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/vehicles/{device_id}':
    parameters:
      - name: device_id
        schema:
          $ref: '#/components/schemas/Uuid'
        in: path
        required: true
        description: The `device_id` of a Provider's Vehicle.
    get:
      operationId: get-vehicles-device_id
      description: 'Get the specified vehicle, with properties that do not change often.'
      summary: '/vehicles/{device_id}'
      responses:
        '200':
          description: Vehicle found.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Version'
                  - $ref: '#/components/schemas/Last_updated'
                  - $ref: '#/components/schemas/Ttl'
                  - type: object
                    description: Vehicle data payload
                    required:
                      - vehicles
                    properties:
                      vehicles:
                        type: array
                        minItems: 1
                        maxItems: 1
                        items:
                          $ref: '#/components/schemas/Vehicle'
        '400':
          description: Bad request.
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: Vehicle not found.
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /vehicles/status:
    get:
      operationId: get-vehicles-status
      description: 'Get a list of known vehicles, with specific vehicle status records that are updated frequently.'
      summary: /vehicles/status
      responses:
        '200':
          description: Vehicles found.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Version'
                  - $ref: '#/components/schemas/Paging'
                  - $ref: '#/components/schemas/Last_updated'
                  - $ref: '#/components/schemas/Ttl'
                  - type: object
                    description: Vehicles status data payload
                    required:
                      - vehicles_status
                    properties:
                      vehicles_status:
                        type: array
                        items:
                          $ref: '#/components/schemas/Vehicle-status'
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: Vehicles not found.
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/vehicles/status/{device_id}':
    parameters:
      - name: device_id
        schema:
          $ref: '#/components/schemas/Uuid'
        in: path
        required: true
        description: The `device_id` of a Provider's Vehicle.
    get:
      operationId: get-vehicles-status-device_id
      description: 'Get the specified vehicle, with specific vehicle status records that are updated frequently.'
      summary: '/vehicles/status/{device_id}'
      responses:
        '200':
          description: Vehicle found.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Version'
                  - $ref: '#/components/schemas/Last_updated'
                  - $ref: '#/components/schemas/Ttl'
                  - type: object
                    description: Vehicles status data payload
                    required:
                      - vehicles_status
                    properties:
                      vehicles_status:
                        type: array
                        minItems: 1
                        maxItems: 1
                        items:
                          $ref: '#/components/schemas/Vehicle-status'
        '400':
          description: Bad request.
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: Vehicle not found.
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /trips:
    parameters:
      - name: end_time
        schema:
          $ref: '#/components/schemas/Iso-dayhour'
        in: query
        required: true
        description: The UTC hour during which requested trips ended.
    get:
      operationId: get-trips-end_time
      description: Get all trips with an end time occurring within the hour.
      summary: /trips
      responses:
        '200':
          description: Hour has been processed.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Version'
                  - type: object
                    required:
                      - trips
                    properties:
                      trips:
                        type: array
                        items:
                          $ref: '#/components/schemas/Trip'
        '202':
          description: Data is not yet available for this hour.
        '400':
          description: Request did not contain an `end_time`.
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: 'Hour is not in the past, or no operations during this hour.'
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /telemetry:
    parameters:
      - name: telemetry_time
        schema:
          $ref: '#/components/schemas/Iso-dayhour'
        in: query
        required: true
        description: The UTC hour during which telemetry events occurred.
    get:
      operationId: get-telemetry-telemetry_time
      description: Get all telemetry with timestamp occurring within the hour.
      summary: /telemetry
      responses:
        '200':
          description: Hour has been processed.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Version'
                  - type: object
                    description: Telemetry data payload
                    required:
                      - telemetry
                    properties:
                      telemetry:
                        type: array
                        items:
                          $ref: '#/components/schemas/Telemetry'
        '400':
          description: Request did not contain a `telemetry_time`.
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /events/historical:
    parameters:
      - name: event_time
        schema:
          $ref: '#/components/schemas/Iso-dayhour'
        in: query
        required: true
        description: The UTC hour during which events occurred.
    get:
      operationId: get-events-historical-event_time
      description: Get all status changes with an event time occurring within the hour.
      summary: /events/historical
      responses:
        '200':
          description: Hour has been processed.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Version'
                  - type: object
                    description: Events data payload
                    required:
                      - events
                    properties:
                      events:
                        type: array
                        items:
                          $ref: '#/components/schemas/Event'
        '202':
          description: Data is not yet available for this hour.
        '400':
          description: Request did not contain an `event_time`.
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: 'Hour is not in the past, or no operations during this hour.'
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /events/recent:
    parameters:
      - name: start_time
        schema:
          $ref: '#/components/schemas/Timestamp'
        in: query
        required: true
        description: status changes where start_time <= event.timestamp
      - name: end_time
        schema:
          $ref: '#/components/schemas/Timestamp'
        in: query
        required: true
        description: status changes where event.timestamp < end_time
    get:
      operationId: get-events-recent-start_time-end_time
      description: Get all status changes at most two weeks old.
      summary: /events/recent
      responses:
        '200':
          description: Range was valid and within the prior two weeks.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Version'
                  - $ref: '#/components/schemas/Paging'
                  - type: object
                    description: Events data payload
                    required:
                      - events
                    properties:
                      events:
                        type: array
                        items:
                          $ref: '#/components/schemas/Event'
        '400':
          description: 'Request did not contain a `start_time`, `end_time`, or the range was more than 2 weeks in the past.'
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /stops:
    get:
      operationId: get-stops
      description: Stop information should be updated on a near-realtime basis by providers who operate docked mobility devices in a given municipality.
      summary: /stops
      responses:
        '200':
          description: Stops found.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Version'
                  - $ref: '#/components/schemas/Last_updated'
                  - $ref: '#/components/schemas/Ttl'
                  - type: object
                    description: Stops data payload
                    required:
                      - stops
                    properties:
                      stops:
                        type: array
                        items:
                          $ref: '#/components/schemas/Stop'
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/stops/{stop_id}':
    parameters:
      - name: stop_id
        schema:
          $ref: '#/components/schemas/Uuid'
        in: path
        required: true
        description: The `stop_id` for a Provider's Stop.
    get:
      operationId: get-stops-stop_id
      description: Stop information should be updated on a near-realtime basis by providers who operate docked mobility devices in a given municipality.
      summary: '/stops/{stop_id}'
      responses:
        '200':
          description: Stop found.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/Version'
                  - $ref: '#/components/schemas/Last_updated'
                  - $ref: '#/components/schemas/Ttl'
                  - type: object
                    description: Stops data payload
                    required:
                      - stops
                    properties:
                      stops:
                        type: array
                        minItems: 1
                        maxItems: 1
                        items:
                          $ref: '#/components/schemas/Stop'
        '400':
          description: Bad request.
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: Stop not found.
        '406':
          description: MDS version in Accept header is unsupported or invalid.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/reports/{filename}':
    parameters:
      - name: filename
        schema:
          type: string
          pattern: '\d{4}-\d{2}\.csv'
          examples:
            - 2023-12.csv
        in: path
        required: true
        description: 'The name of the report to retrieve, formatted by year and month like `YYYY-MM.csv`'
    get:
      operationId: get-reports-filename
      description: 'Reports are information that providers can send back to agencies containing aggregated data that is not contained within other MDS endpoints, like counts of special groups of riders.'
      summary: '/reports/{filename}'
      responses:
        '200':
          description: Report found.
          content:
            text/csv:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          description: 'Unauthorized: Invalid, expired, or insufficient scope of token.'
        '404':
          description: Report not found.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

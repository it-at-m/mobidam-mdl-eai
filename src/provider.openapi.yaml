openapi: 3.1.0
x-stoplight:
  id: uffrjoub3dm0o
info:
  title: Provider
  version: '2.0'
  summary: The Provider API endpoints are intended to be implemented by mobility providers and consumed by regulatory agencies.
  contact:
    url: 'https://github.com/openmobilityfoundation/mobility-data-specification'
    name: Open Mobility Foundation
    email: info@openmobilityfoundation.org
  license:
    name: Creative Commons Attribution 4.0 International Public License
    url: 'https://github.com/openmobilityfoundation/mobility-data-specification/blob/main/LICENSE'
  description: |-
    The Provider API endpoints are intended to be implemented by mobility providers and consumed by regulatory agencies.

    Data is **pulled** from providers by agencies. When a municipality queries information from a mobility provider, the
    Provider API has a historical view of operations in a standard format.

    This specification contains a data standard for _mobility as a service_ providers to define a RESTful API for
    municipalities to access on-demand.

    <img src="https://i.imgur.com/yzXrKpo.png" width="120" align="right" alt="MDS Provider Icon" border="0">
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        All MDS Provider endpoints require authentication.

        JSON Web Token ([JWT](https://jwt.io/introduction/)) is RECOMMENDED as the token format.

        MDS API producers MAY include any metadata in the JWT they wish that helps to route, log, permission, or debug agency requests, leaving their internal implementation flexible.
  schemas:
    Currency-cost:
      title: data-types/currency-cost
      description: 'Represents an optional cost defined in a [`currency`](./currency.yaml).'
      x-stoplight:
        id: 1l6vqu5tyd5at
      type:
        - integer
        - 'null'
      minimum: 0
      examples:
        - 500
        - 520
        - 1000
    Currency:
      title: data-types/currency
      default: USD
      description: 'An [ISO 4217 Alphabetic Currency Code](https://en.wikipedia.org/wiki/ISO_4217#Active_codes) representing currency of the payee. If null, USD cents is implied.'
      examples:
        - USD
        - EUR
        - GBP
      pattern: '^[A-Z]{3}$'
      type:
        - string
        - 'null'
      x-stoplight:
        id: 85j2txhx6x32o
    Event-type-array:
      description: Vehicle event types for state change.
      title: data-types/event-type-array
      items:
        $ref: '#/components/schemas/Event-type'
      minItems: 1
      type: array
      uniqueItems: true
      x-stoplight:
        id: 1dq8fejw6intb
    Event-type:
      title: data-types/event-type
      description: Events are possible transitions between vehicle states.
      enum:
        - agency_drop_off
        - agency_pick_up
        - battery_charged
        - battery_low
        - changed_geographies
        - charging_end
        - charging_start
        - comms_lost
        - comms_restored
        - compliance_pick_up
        - customer_cancellation
        - decommissioned
        - driver_cancellation
        - fueling_end
        - fueling_start
        - located
        - maintenance
        - maintenance_end
        - maintenance_pick_up
        - not_located
        - off_hours
        - on_hours
        - order_drop_off
        - order_pick_up
        - passenger_cancellation
        - provider_cancellation
        - provider_drop_off
        - rebalance_pick_up
        - recommission
        - remote_end
        - remote_start
        - reservation_cancel
        - reservation_start
        - reservation_stop
        - service_end
        - service_start
        - system_resume
        - system_suspend
        - trip_cancel
        - trip_end
        - trip_enter_jurisdiction
        - trip_leave_jurisdiction
        - trip_pause
        - trip_resume
        - trip_start
        - trip_stop
        - unspecified
      type: string
      x-stoplight:
        id: lsm5td7gknbxz
    Gps:
      description: Telemetry position data.
      title: data-types/gps
      properties:
        altitude:
          description: Altitude above mean sea level in meters.
          type: number
        heading:
          description: Degrees - clockwise starting at 0 degrees at true North.
          type: number
        horizontal_accuracy:
          description: Horizontal accuracy in meters.
          type: number
        lat:
          description: Latitude coordinate.
          maximum: 90
          minimum: -90
          type: number
        lng:
          description: Longitude coordinate.
          maximum: 180
          minimum: -180
          type: number
        satellites:
          $ref: '#/components/schemas/Integer-positive'
          description: Number of GPS or GNSS satellites.
        speed:
          description: Estimated speed in meters / sec as reported by the GPS chipset.
          type: number
        vertical_accuracy:
          description: Vertical accuracy in meters.
          type: number
      required:
        - lat
        - lng
      type: object
      x-stoplight:
        id: 8aooo5ag7x7vh
    Integer-positive:
      title: data-types/integer-positive
      description: An integer greater than or equal to 0.
      minimum: 0
      type: integer
      x-stoplight:
        id: nfkphjmpm8yay
    Iso-date:
      description: The date of the last inspection of the vehicle in ISO 8601 `YYYY-MM-DD`.
      title: data-types/iso-date
      examples:
        - '2023-12-31'
        - '2024-01-01'
      pattern: '(19[789]\d|[2-9]\d{3})-(0[1-9]|1[02])-([12]\d|0[1-9]|3[01])'
      type: string
      x-stoplight:
        id: hx3fr01xgzhii
    Iso-dayhour:
      title: data-types/iso-dayhour
      description: An ISO 8601 extended datetime representing an UTC hour between 00 and 23 `YYYY-MM-DDTHH`; valid for dates in 1970 and later.
      examples:
        - 2023-12-31T23
        - 2024-01-01T01
      pattern: '(19[789]\d|[2-9]\d{3})-(0[1-9]|1[02])-([12]\d|0[1-9]|3[01])T([0-2][0-3]|[01]\d)'
      type: string
      x-stoplight:
        id: rc4v7nsrgdqpm
    Minimum-year:
      title: data-types/minimum-year
      description: Represents a minimum for fields that capture a year as an integer. Derived from Unix timestamp 0.
      minimum: 1970
      type: integer
      x-stoplight:
        id: fa7v7itv8mti4
    Propulsion-type-array:
      description: The type of propulsion; allows multiple values.
      minItems: 1
      title: data-types/propulsion-type-array
      items:
        $ref: '#/components/schemas/Propulsion-type'
      type: array
      uniqueItems: true
      x-stoplight:
        id: 4ao4xw23z8wrf
    Propulsion-type:
      title: data-types/propulsion-type
      description: 'The allowed types of propulsion in MDS. Based off of `propulsion_type` in [GBFS vehicle_types](https://github.com/MobilityData/gbfs/blob/master/gbfs.md#vehicle_typesjson)'
      enum:
        - human
        - electric_assist
        - electric
        - combustion
        - combustion_diesel
        - hybrid
        - hydrogen_fuel_cell
        - plug_in_hybrid
      type: string
      x-stoplight:
        id: 1ucdttnwhf2bo
    String:
      title: data-types/string
      description: A length-limited string type.
      examples:
        - ABC123
      maxLength: 255
      pattern: ^(.*)$
      type: string
      x-stoplight:
        id: 2vqv7166161kh
    Timestamp:
      title: data-types/timestamp
      description: Integer milliseconds since Unix epoch.
      examples:
        - 1514764800000
        - 1681855703000
      minimum: 1514764800000
      multipleOf: 1
      type: number
      x-stoplight:
        id: vliol1hqlxw6y
    Uuid-array:
      minItems: 1
      description: 'If telemetry occurred during a trip, the ID of the trip(s).'
      title: data-types/uuid-array
      type: array
      x-stoplight:
        id: v932clitbqv31
      uniqueItems: true
      items:
        $ref: '#/components/schemas/Uuid'
    Uuid:
      title: data-types/uuid
      description: A UUID used to uniquely identity an object.
      type: string
      x-stoplight:
        id: np9kodwmy2kqa
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      examples:
        - 3c9604d6-b5ee-11e8-96f8-529269fb1459
    Vehicle-state:
      description: The state of the vehicle as of this event.
      title: data-types/vehicle-state
      type: string
      x-stoplight:
        id: 3j1h7u4vvc7kr
      enum:
        - removed
        - available
        - non_operational
        - reserved
        - on_trip
        - stopped
        - non_contactable
        - missing
        - elsewhere
    Vehicle-type-counts:
      description: 'Number of total places per [`vehicle_type`](./data-types/vehicle-type.yaml).'
      title: data-types/vehicle-type-counts
      type: object
      x-stoplight:
        id: isobk3kg3rr8r
      additionalProperties: false
      propertyNames:
        $ref: '#/components/schemas/Vehicle-type'
      patternProperties:
        '':
          $ref: '#/components/schemas/Integer-positive'
    Vehicle-type:
      title: data-types/vehicle-type
      description: 'The allowed types of of vehicles in MDS. Based off of `form_factor` in [GBFS vehicle_types](https://github.com/MobilityData/gbfs/blob/master/gbfs.md#vehicle_typesjson), with some additional to support MDS modes.'
      type: string
      x-stoplight:
        id: gbhhyditnvs5w
      enum:
        - bicycle
        - bus
        - cargo_bicycle
        - car
        - delivery_robot
        - moped
        - motorcycle
        - scooter_standing
        - scooter_seated
        - truck
        - other
    Version_2:
      title: data-type/version
      description: The version of MDS this data represents.
      type: string
      x-stoplight:
        id: bt49ntcbcuxbh
      pattern: '^2\.(\d|[1-9]\d+)\.(\d|[1-9]\d+)$'
      examples:
        - 2.0.0
    Event:
      title: models/event
      description: 'Events represent changes in [Vehicle Status](./vehicle-status.yaml).'
      type: object
      x-stoplight:
        id: 34niv0zuhmwmg
      required:
        - device_id
        - provider_id
        - event_id
        - vehicle_state
        - event_types
        - timestamp
      allOf:
        - properties:
            device_id:
              $ref: '#/components/schemas/Uuid'
              description: A unique device ID in UUID format.
            provider_id:
              $ref: '#/components/schemas/Uuid'
              description: 'A UUID for the Provider, unique within MDS. See MDS [provider list](https://github.com/openmobilityfoundation/mobility-data-specification/blob/main/providers.csv).'
            data_provider_id:
              $ref: '#/components/schemas/Uuid'
              description: 'If different than `provider_id`, a UUID for the data solution provider managing the data feed in this endpoint.'
            event_id:
              $ref: '#/components/schemas/Uuid'
              description: A unique event ID in UUID format.
            vehicle_state:
              $ref: '#/components/schemas/Vehicle-state'
              description: The state of the vehicle as of this event.
            event_types:
              $ref: '#/components/schemas/Event-type-array'
              description: Vehicle event types for state change.
            timestamp:
              $ref: '#/components/schemas/Timestamp'
              description: Date/time that event occurred.
            publication_time:
              $ref: '#/components/schemas/Timestamp'
              description: Date/time event became available through the status changes endpoint.
            location:
              $ref: '#/components/schemas/Gps'
              description: Location of the event.
            event_geographies:
              $ref: '#/components/schemas/Uuid-array'
              description: Array of Geography UUIDs consisting of every Geography that contains the location of the status change. See Geography Driven Events. Required if location is not present.
            battery_percent:
              $ref: '#/components/schemas/Integer-positive'
              description: 'Percent battery charge of vehicle, expressed between 0 and 100.'
              maximum: 100
            fuel_percent:
              $ref: '#/components/schemas/Integer-positive'
              description: 'Percent fuel in vehicle, expressed between 0 and 100.'
              maximum: 100
            trip_ids:
              $ref: '#/components/schemas/Uuid-array'
              description: 'Trip UUIDs (foreign key to /trips endpoint), conditionally required for different modes.'
            associated_ticket:
              $ref: '#/components/schemas/String'
              description: Identifier for an associated ticket inside an Agency-maintained 311 or CRM system.
        - oneOf:
            - title: modes/car-share
              $ref: '#/components/schemas/Event_2'
            - title: modes/delivery-robots
              $ref: '#/components/schemas/Event_3'
            - title: modes/micromobility
              $ref: '#/components/schemas/Event_4'
            - title: modes/passenger-services
              $ref: '#/components/schemas/Event_5'
        - anyOf:
            - title: Location-based event
              required:
                - location
            - title: Geography-driven event
              required:
                - event_geographies
              properties:
                event_geographies:
                  minItems: 1
    Accessibility-attributes:
      description: The accessibility options utilized for a given trip. Required if available.
      title: modes/car-share/accessibility-attributes
      type: array
      x-stoplight:
        id: e9mpudr8layzh
      uniqueItems: true
      items:
        type: string
        enum:
          - wheelchair_accessible
    Event_2:
      title: modes/car-share
      description: Event definition for the `car-share` mode.
      type: object
      x-stoplight:
        id: 0jy8uoz32ksy8
      oneOf:
        - title: vehicle_state - removed
          properties:
            vehicle_state:
              const: removed
            event_types:
              items:
                enum:
                  - comms_restored
                  - decommissioned
                  - maintenance
                  - maintenance_pick_up
        - title: vehicle_state - available
          properties:
            vehicle_state:
              const: available
            event_types:
              items:
                enum:
                  - comms_restored
                  - driver_cancellation
                  - customer_cancellation
                  - provider_cancellation
                  - service_start
                  - trip_end
                  - trip_enter_jurisdiction
        - title: vehicle_state - non_operational
          properties:
            vehicle_state:
              const: non_operational
            event_types:
              items:
                enum:
                  - comms_restored
                  - maintenance_end
                  - recommissioned
                  - service_end
                  - trip_enter_jurisdiction
        - title: vehicle_state - reserved
          properties:
            vehicle_state:
              const: reserved
            event_types:
              items:
                enum:
                  - comms_restored
                  - reservation_start
                  - trip_enter_jurisdiction
        - title: vehicle_state - on_trip
          properties:
            vehicle_state:
              const: on_trip
            event_types:
              items:
                enum:
                  - comms_restored
                  - trip_enter_jurisdiction
                  - trip_resume
                  - trip_start
        - title: vehicle_state - non_contactable
          properties:
            vehicle_state:
              const: non_contactable
            event_types:
              items:
                enum:
                  - comms_lost
        - title: vehicle_state - stopped
          properties:
            vehicle_state:
              const: stopped
            event_types:
              items:
                enum:
                  - charging_end
                  - charging_start
                  - comms_restored
                  - fueling_end
                  - fueling_start
                  - remote_end
                  - remote_start
                  - reservation_stop
                  - trip_stop
        - title: vehicle_state - elsewhere
          properties:
            vehicle_state:
              const: elsewhere
            event_types:
              items:
                enum:
                  - comms_restored
                  - trip_leave_jurisdiction
      if:
        properties:
          event_types:
            contains:
              - customer_cancellation
              - driver_cancellation
              - provider_cancellation
              - reservation_start
              - reservation_stop
              - trip_end
              - trip_enter_jurisdiction
              - trip_leave_jurisdiction
              - trip_resume
              - trip_start
              - trip_stop
      then:
        properties:
          trip_ids:
            minItems: 1
    Trip_2:
      title: modes/care-share/trip
      description: Trip definition for the `car-share` mode.
      type: object
      x-stoplight:
        id: lhj9vmnhh6uk8
      required:
        - trip_type
      properties:
        journey_id:
          $ref: '#/components/schemas/Uuid'
          description: |-
            A unique journey ID for associating collections of trips. The journey_id field shall have a consistent value in
            overlapping trips for a single reservation period, e.g. trips taken by a customer between ignition states over the
            duration of their reservation. A reservation is the duration the customer has continuous exclusive access to the vehicle
            whether parked or in motion. Journeys may be point-to-point or multi-segment.
        journey_attributes:
          type: object
          additionalProperties: false
          properties:
            reservation_id:
              $ref: '#/components/schemas/Uuid'
              description: 'A unique identifier for an entire car share reservation, tied across multiple journeys and therefore trips.'
        trip_type:
          minItems: 1
          maxItems: 1
          items:
            enum:
              - private
              - reservation
              - empty
        trip_attributes:
          required:
            - reservation_type
            - passenger_count
            - requested_time
            - quoted_trip_start_time
          properties:
            reservation_type:
              enum:
                - phone_dispatch
                - phone
                - text
                - app
            app_name:
              $ref: '#/components/schemas/String'
              description: Name of the app used to reserve the trip which could be provider's app or 3rd party app.
            permit_license_number:
              $ref: '#/components/schemas/String'
              description: The permit license number of the organization that dispatched the vehicle.
            driver_id:
              $ref: '#/components/schemas/String'
              description: 'Universal identifier of a specific driver, static across operators, like a driver''s license number, for company employees in `reservation` or `empty` trip types, not `private` trips. Could also be used as a lookup in an agency''s internal driver system.'
        fare_attributes:
          required:
            - payment_type
            - fare_type
          properties:
            payment_type:
              type: string
              enum:
                - account_number
                - cash
                - credit_card
                - mobile_app
                - no_payment
                - phone
                - voucher
                - test
            fare_type:
              description: Indicator of which rate was charged.
              type: string
              enum:
                - meter_fare
                - upfront_pricing
                - flat_rate
            tolls:
              $ref: '#/components/schemas/Currency-cost'
              description: 'Sum of any and all tolls charged for the trip, such as bridge tolls.'
            base_rate:
              $ref: '#/components/schemas/Currency-cost'
              description: Minimum fare to be charged as soon as the trip starts.
            exit_fee:
              $ref: '#/components/schemas/Currency-cost'
              description: 'Fee to exit location, like an airport.'
            other_fees:
              $ref: '#/components/schemas/Currency-cost'
              description: 'Amount of any fees charged to the customer. Includes baggage fees, cleaning fee. Excludes other fees returned.'
            tip:
              $ref: '#/components/schemas/Currency-cost'
              description: Amount of tip paid by customer.
            extra_amount:
              $ref: '#/components/schemas/Currency-cost'
              description: Miscellaneous extra amounts charged to customer not covered by other fields.
            taxes:
              $ref: '#/components/schemas/Currency-cost'
              description: Amount of taxes paid for the ride.
            surcharge:
              $ref: '#/components/schemas/Currency-cost'
              description: Any surcharge pricing.
        accessibility_attributes:
          $ref: '#/components/schemas/Accessibility-attributes'
          description: The accessibility options utilized for a given trip. Required if available.
    Vehicle_2:
      title: modes/car-share/vehicle
      description: Vehicle definition for the `car-share` mode.
      type: object
      x-stoplight:
        id: ept949jym2d7l
      properties:
        accessibility_attributes:
          $ref: '#/components/schemas/Accessibility-attributes'
          description: The accessibility options available on a given vehicle. Required if available.
        vehicle_attributes:
          type: object
          description: 'Many of these attributes come from fields in [GBFS vehicle_types](https://github.com/MobilityData/gbfs/blob/v2.3/gbfs.md#vehicle_typesjson).'
          additionalProperties: false
          required:
            - year
            - make
            - model
            - color
            - vin
            - license_plate
          properties:
            year:
              $ref: '#/components/schemas/Minimum-year'
            make:
              $ref: '#/components/schemas/String'
            model:
              $ref: '#/components/schemas/String'
            color:
              $ref: '#/components/schemas/String'
            vin:
              $ref: '#/components/schemas/String'
              description: The vehicle's Vehicle Identification Number.
            placard_number:
              $ref: '#/components/schemas/String'
              description: The registered placard number of the vehicle.
            license_plate:
              $ref: '#/components/schemas/String'
              description: The registered vehicle license/number/registration plate identifier on the vehicle.
            inspection_date:
              $ref: '#/components/schemas/Iso-date'
              description: The date of the last inspection of the vehicle in ISO 8601 `YYYY-MM-DD`.
            snow_shovel:
              type: boolean
              description: Vehicle has a shovel for removing snow or ice from around vehicle or vehicle path.
            snow_brush:
              type: boolean
              description: Vehicle has brushes for removing snow or ice from vehicle.
            bike_rack:
              type: boolean
              description: Vehicle has car roof or trunk mounted bike rack.
            park_access:
              type: boolean
              description: Vehicle has an access pass to a national/regional/municipal park system.
            toll_transponder:
              type: boolean
              description: Vehicle has a toll transponder for national/regional toll system.
            phone_charger:
              type: boolean
              description: Vehicle has a place to charge a cellphone.
            sunshade:
              type: boolean
              description: Vehicle has a sunshade available (i.e. for windshield).
            cargo_volume_capacity:
              $ref: '#/components/schemas/Integer-positive'
              description: 'Cargo volume available in the vehicle, expressed in liters. For cars, it corresponds to the space between the boot floor, including the storage under the hatch, to the rear shelf in the trunk.'
            cargo_load_capacity:
              $ref: '#/components/schemas/Integer-positive'
              description: 'The capacity of the vehicle cargo space (excluding passengers), expressed in kilograms.'
            door_count:
              $ref: '#/components/schemas/Integer-positive'
              description: The number of doors this vehicle type has.
            wheel_count:
              $ref: '#/components/schemas/Integer-positive'
              description: The number of doors this vehicle type has.
            air_conditioning:
              type: boolean
              description: Vehicle has air conditioning.
            gear_switch:
              type: string
              enum:
                - automatic
                - manual
            convertible:
              type: boolean
              description: Vehicle has a retractable roof.
            cruise_control:
              type: boolean
              description: Vehicle has a cruise control system.
            navigation:
              type: boolean
              description: Vehicle has a built-in navigation system.
    Accessibility-attributes_2:
      description: The accessibility options available on a given delivery robot device. Required if available.
      title: modes/delivery-robots/accessibility-attributes
      type: object
      x-stoplight:
        id: zsnl5o3q9d0a0
      additionalProperties: false
      properties:
        audio_cue:
          type: boolean
          description: Is the device equipped with audio cues upon delivery.
        visual_cue:
          type: boolean
          description: Is the device equipped with visual cues upon delivery.
        remote_open:
          type: boolean
          description: Can the device door be remotely opened to retrieve cargo upon delivery.
    Event_3:
      title: modes/delivery-robots
      description: Event definition for the `delivery-robots` mode.
      type: object
      x-stoplight:
        id: sksecq6lesbxa
      oneOf:
        - title: vehicle_state - removed
          properties:
            vehicle_state:
              const: removed
            event_types:
              items:
                enum:
                  - comms_restored
                  - decommissioned
                  - located
                  - maintenance_pick_up
        - title: vehicle_state - available
          properties:
            vehicle_state:
              const: available
            event_types:
              items:
                enum:
                  - comms_restored
                  - customer_cancellation
                  - driver_cancellation
                  - located
                  - provider_cancellation
                  - service_start
                  - trip_end
                  - trip_enter_jurisdiction
        - title: vehicle_state - non_operational
          properties:
            vehicle_state:
              const: non_operational
            event_types:
              items:
                enum:
                  - comms_restored
                  - located
                  - maintenance
                  - maintenance_end
                  - recommissioned
                  - service_end
                  - trip_enter_jurisdiction
        - title: vehicle_state - reserved
          properties:
            vehicle_state:
              const: reserved
            event_types:
              items:
                enum:
                  - comms_restored
                  - located
                  - reservation_start
                  - trip_enter_jurisdiction
        - title: vehicle_state - on_trip
          properties:
            vehicle_state:
              const: on_trip
            event_types:
              items:
                enum:
                  - comms_restored
                  - located
                  - trip_enter_jurisdiction
                  - trip_resume
                  - trip_start
        - title: vehicle_state - stopped
          properties:
            vehicle_state:
              const: stopped
            event_types:
              items:
                enum:
                  - comms_restored
                  - located
                  - order_drop_off
                  - order_pick_up
                  - reservation_stop
                  - trip_pause
        - title: vehicle_state - non_contactable
          properties:
            vehicle_state:

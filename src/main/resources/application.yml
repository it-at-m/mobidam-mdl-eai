camel:
  springboot:
    #    Sollte sich der Camel Main Thread nach dem Start wieder beenden, folgende Property aktivieren (http://camel.apache.org/spring-boot.html).
    main-run-controller: true
    tracing: false
  component:
    aws2-s3:
      region: ...
      override-endpoint: ...
    http:
      proxy-auth-host: ...
      proxy-auth-port: ...
      proxy-auth-scheme: ...

spring:
  application:
    name: '@project.artifactId@'
  security:
    oauth2:
      client:
        registration:
          custom:
            provider: ...
            client-id: ...
            client-secret: ...
            authorization-grant-type: ...
        provider:
          custom:
            token-uri: ...

# https://docs.spring.io/spring-boot/docs/current/reference/html/actuator.html
management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    info:
      enabled: true
    health:
      enabled: true
    metrics:
      enabled: true
  info:
    env:
      enabled: true
    camel:
      enabled: false

info:
  application:
    name: '@project.artifactId@'
    version: '@project.version@'

logging:
  level:
    org:
      springframework: INFO

oauth2:
  registration:
    id: ...

de.muenchen.mobidam:
  data:
    review-specification:
      malicious-data-regex:
        key:
    defined-resource-types:
      resource-types:
        xml:
          allowed-mime-types:
        csv:
          allowed-mime-types:
  eai:
    cacerts-file: ...
    cacerts-password: ...
  common:
    s3:
      bucket-credential-configs:
        s3-bucket-1:
          access-key-env-var: ...
          secret-key-env-var: ...
